name: web

on:
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/web.yml'
      - '.github/workflows/pages.yml'
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/web.yml'
  workflow_dispatch:
  # pages.yml calls this workflow so a deploy only happens after these checks pass
  workflow_call:

permissions:
  contents: read

concurrency:
  # github.workflow is the caller's name when called from pages.yml, so a deploy's checks never
  # cancel (or get cancelled by) the push-triggered run of this workflow
  group: web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: web

jobs:
  web:
    name: lint, check, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Generate fixture data
        run: npm run fixtures

      - name: Lint (Prettier + ESLint)
        run: npm run lint

      - name: Type check (svelte-check)
        run: npm run check

      - name: Unit tests (Vitest)
        run: npx vitest run

      - name: Build for GitHub Pages base path
        run: npm run build
        env:
          BASE_PATH: /white_xmas

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Smoke test (Playwright, built site + fixtures)
        run: npx playwright test
        env:
          CI: 'true'

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7
